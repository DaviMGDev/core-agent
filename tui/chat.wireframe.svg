<?xml version="1.0" encoding="UTF-8"?>
<!-- nvchat — launch wireframe: files panel + full-main chat. Structure follows chat.layout.txt.
     Grid: 160 x 50 terminal cells, 8 x 16 px each (DejaVu Sans Mono at 8 px
     advance), which is this machine's 1280 x 800 display. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"
     font-family="DejaVu Sans Mono" font-size="13.2879">
  <title>nvchat — launch wireframe</title>
  <desc>Files panel on the left, the chat full width in the main area (message list and composer) and the statusline of nvchat, drawn on a 160x50 terminal grid.</desc>

  <!-- screen background -->
  <rect width="1280" height="800" fill="#0d1117"/>

  <!-- files panel: (sidebar:open), real neo-tree over the filesystem -->
  <rect x="0" y="0" width="239" height="784" fill="#10151c"/>
  <rect x="239" y="0" width="1" height="784" fill="#30363d"/>

  <!-- files tree: (files-tree) — content is not fixed; the highlighted row is the cursor -->
  <rect x="0" y="144" width="239" height="16" fill="#58a6ff" fill-opacity="0.12"/>
  <rect x="0" y="144" width="2" height="16" fill="#58a6ff"/>
  <text x="16" y="28.5" fill="#e6edf3" font-weight="700">~/Draft/nvchat</text>
  <text x="16" y="44.5" fill="#c9d1d9">▾ nvchat</text>
  <text x="32" y="60.5" fill="#c9d1d9">▾ lua</text>
  <text x="48" y="76.5" fill="#c9d1d9">▾ nvchat</text>
  <text x="64" y="92.5" fill="#8b949e">composer.lua</text>
  <text x="64" y="108.5" fill="#8b949e">draft.lua</text>
  <text x="64" y="124.5" fill="#8b949e">init.lua</text>
  <text x="64" y="140.5" fill="#8b949e">messages.lua</text>
  <text x="64" y="156.5" fill="#e6edf3">sessions.lua</text>
  <text x="64" y="172.5" fill="#8b949e">ui.lua</text>
  <text x="32" y="188.5" fill="#c9d1d9">init.lua</text>
  <text x="16" y="204.5" fill="#c9d1d9">README.md</text>

  <!-- chat: (chat:visible) — message list, full width -->
  <text x="256" y="12.5" fill="#c9d1d9" font-weight="600">assistant</text>
  <text x="344" y="12.5" fill="#6e7681">12:04</text>
  <text x="256" y="28.5" fill="#c9d1d9">The body of a message, wrapped to the width of the panel.</text>
  <text x="256" y="60.5" fill="#c9d1d9" font-weight="600">you</text>
  <text x="296" y="60.5" fill="#6e7681">12:05</text>
  <text x="256" y="76.5" fill="#c9d1d9">Another message body, written by the reader.</text>

  <!-- composer: (composer) — a real editor buffer, cursor only -->
  <rect x="240" y="688" width="1040" height="96" fill="#0f141b"/>
  <rect x="240" y="688" width="1040" height="1" fill="#30363d"/>
  <rect x="256" y="704" width="8" height="16" fill="#58a6ff"/>

  <!-- statusline -->
  <rect x="0" y="784" width="1280" height="16" fill="#161b22"/>
  <text x="16" y="796.5" fill="#58a6ff">-- INSERT --</text>
  <text x="1080" y="796.5" fill="#8b949e">Chat one — 2 messages</text>
</svg>
